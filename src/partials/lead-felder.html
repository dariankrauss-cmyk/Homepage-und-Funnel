<div class="field">
  <label for="vorname">Vorname</label>
  <input class="inp" id="vorname" name="vorname" type="text" autocomplete="given-name" maxlength="80" required>
  <p class="msg" id="vorname-msg">Bitte trag deinen Vornamen ein.</p>
</div>
<div class="field">
  <label for="email">E-Mail</label>
  <input class="inp" id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
  <p class="msg" id="email-msg">Bitte prüf deine E-Mail-Adresse.</p>
</div>
<div class="field">
  <label for="phone">Handynummer <span class="opt-hint">für WhatsApp</span></label>
  <input class="inp" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+49 …" maxlength="40" required>
  <p class="msg" id="phone-msg">Bitte trag eine gültige Handynummer ein.</p>
</div>
